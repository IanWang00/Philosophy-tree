<title>思想的分支树 · 西方哲学脉络</title>
<style>
  :root{
    --paper:#f3ede0;--paper2:#fbf7ee;--panel:#ffffff;--band:#e7dfcd;
    --ink:#1d1e28;--ink2:#3a3846;--ink3:#565365;--hair:#d8cfbc;--gold:#8a5f0d;--goldline:#c79a3e;
    --greek:#b8811f;--scholastic:#9a6231;--rationalism:#2f6bc4;--empiricism:#2c8a4e;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 620px at 84% -12%, #efe6d2 0%, rgba(239,230,210,0) 62%),
      radial-gradient(820px 520px at -6% 108%, #ece2ec 0%, rgba(236,226,236,0) 55%),
      var(--paper);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;
  }
  header{padding:26px 20px 6px;max-width:1000px;margin:0 auto;}
  .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase;margin:0 0 9px;font-weight:700;}
  h1{font-family:"Songti SC","STSong",Georgia,serif;font-weight:700;
     font-size:clamp(27px,6.5vw,40px);letter-spacing:.04em;margin:0 0 8px;line-height:1.12;color:var(--ink);}
  h1 .accent{color:var(--material);}
  .lede{font-size:14.5px;color:var(--ink2);max-width:42em;margin:0;}
  .lede b{color:var(--ink);font-weight:700;}
  .legend{max-width:1000px;margin:16px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:7px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);
    border:1.5px solid var(--hair);color:var(--ink2);border-radius:999px;
    padding:6px 12px 6px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600;
    transition:border-color .18s,color .18s,background .18s;}
  .chip:hover{border-color:var(--ink3);}
  .chip .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .chip[aria-pressed="true"]{color:var(--ink);font-weight:800;}
  .chip.all .dot{background:linear-gradient(90deg,var(--greek),var(--existential),var(--media));}
  .schoolnote{max-width:1000px;margin:11px auto 0;padding:0 20px;min-height:8px;}
  .schoolnote .card{border-left:4px solid var(--ink3);background:var(--panel);
    border-radius:0 10px 10px 0;padding:11px 15px;font-size:13.5px;color:var(--ink2);box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .schoolnote .card b{color:var(--ink);}
  main{max-width:1000px;margin:0 auto;padding:12px 20px 20px;}
  .turnstrip{font-size:12.5px;color:var(--ink2);margin:0 0 6px;line-height:1.6;font-weight:500;}
  .turnstrip b{color:var(--gold);font-weight:700;}
  .maphint{font-size:12px;color:var(--ink3);margin:0 0 8px;font-weight:500;}
  .mapwrap{border:1.5px solid var(--hair);border-radius:16px;background:var(--paper2);
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;box-shadow:0 2px 10px rgba(60,50,30,.06);}
  svg.tree{display:block;}
  .axis{stroke:var(--goldline);stroke-width:1.4;}
  .axislab{fill:var(--gold);font-size:11px;font-weight:700;letter-spacing:.1em;}
  .colhead-pill{fill:var(--band);}
  .colhead{fill:var(--ink2);font-size:10.5px;letter-spacing:.06em;font-weight:700;}
  .edge{fill:none;transition:opacity .25s;}
  .node{cursor:pointer;transition:opacity .25s;}
  .node rect.box{fill:var(--panel);stroke-width:2.6;}
  .node rect.glow{fill:none;stroke:var(--goldline);stroke-width:2;opacity:.9;}
  .node .emo{font-size:16px;text-anchor:middle;dominant-baseline:central;}
  .node .nm{fill:var(--ink);font-size:13.5px;font-weight:700;font-family:"Songti SC","STSong",serif;dominant-baseline:central;}
  .node .dt{fill:var(--ink3);font-size:10px;font-weight:600;dominant-baseline:central;}
  .node .turncap{fill:var(--gold);font-size:9.5px;font-weight:700;dominant-baseline:central;}
  .node:focus{outline:none;}
  .node:focus rect.box{stroke:var(--ink);}
  .node.dim,.edge.dim{opacity:.12;}
  .backdrop{position:fixed;inset:0;background:rgba(30,26,18,.5);opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .backdrop.on{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--panel);
    border:1px solid var(--hair);border-radius:20px 20px 0 0;transform:translateY(24px);
    transition:transform .28s;padding:0 0 34px;box-shadow:0 -8px 40px rgba(40,30,15,.2);}
  @media(min-width:640px){.backdrop{align-items:center;}.sheet{border-radius:20px;transform:translateY(16px);}}
  .backdrop.on .sheet{transform:translateY(0);}
  .sheet .top{position:sticky;top:0;background:var(--panel);padding:20px 22px 14px;
    border-bottom:1px solid var(--hair);border-top:5px solid var(--ink3);border-radius:20px 20px 0 0;z-index:2;}
  .sheet .close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    background:var(--paper);border:1.5px solid var(--hair);color:var(--ink2);font-size:17px;cursor:pointer;line-height:1;font-weight:700;}
  .sheet .sym{font-size:30px;line-height:1;}
  .sheet .who{display:flex;align-items:center;gap:14px;margin-top:8px;}
  .sheet .who h2{font-family:"Songti SC","STSong",serif;font-size:26px;margin:0;font-weight:700;letter-spacing:.03em;color:var(--ink);}
  .sheet .who .en{font-family:Georgia,serif;font-size:12.5px;color:var(--ink3);margin-top:3px;letter-spacing:.03em;font-weight:600;}
  .sheet .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;}
  .sheet .schbadge{padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.03em;}
  .sheet .dates{font-size:12px;color:var(--ink3);letter-spacing:.04em;font-weight:600;}
  .sheet .body{padding:18px 22px 4px;}
  .essence{font-family:"Songti SC","STSong",serif;font-size:17px;line-height:1.6;color:var(--ink);margin:0 0 6px;font-weight:600;}
  .seclabel{font-size:11px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin:20px 0 9px;font-weight:700;}
  .ctx{font-size:14px;color:var(--ink2);line-height:1.8;margin:0;}
  ul.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;}
  ul.ideas li{position:relative;padding-left:20px;font-size:14px;color:var(--ink2);line-height:1.8;}
  ul.ideas li::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:2px;background:var(--ink3);}
  ul.ideas li b{color:var(--ink);font-weight:700;}
  .turnbanner{display:inline-block;background:#f6ecd2;border:1.5px solid var(--goldline);color:var(--gold);
    font-weight:700;font-size:12px;padding:4px 13px;border-radius:999px;margin-bottom:11px;letter-spacing:.05em;}
  .legacy{font-size:14px;color:var(--ink2);line-height:1.85;margin:0;}
  .legacy b{color:var(--ink);font-weight:700;}
  .lineage{display:flex;flex-direction:column;gap:11px;}
  .lin-row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .lin-row .k{font-size:12px;color:var(--ink3);flex:none;width:52px;letter-spacing:.05em;font-weight:600;}
  .relchips{display:flex;flex-wrap:wrap;gap:7px;}
  .relchip{background:var(--paper);border:1.5px solid var(--hair);border-radius:999px;padding:5px 12px;
    font-size:13px;color:var(--ink);cursor:pointer;font-family:"Songti SC","STSong",serif;font-weight:600;transition:border-color .18s;}
  .relchip:hover{border-color:var(--ink3);}
  .none{color:var(--ink3);font-size:13px;}
  .works{display:flex;flex-wrap:wrap;gap:8px;}
  .work{background:var(--paper);border:1.5px solid var(--hair);border-radius:7px;padding:6px 11px;font-size:13px;color:var(--ink2);font-weight:500;}
  .work.plain{border-style:dashed;}
  .quote{margin:20px 0 0;padding:15px 19px;border-radius:12px;background:var(--paper);
    border-left:4px solid var(--ink3);font-family:"Songti SC","STSong",serif;font-size:16px;line-height:1.65;color:var(--ink);font-weight:600;}
  .quote::before{content:"「";color:var(--ink3);}
  .quote::after{content:"」";color:var(--ink3);}
  footer{max-width:1000px;margin:0 auto;padding:8px 20px 46px;color:var(--ink3);font-size:12px;}
  .oppbtn{margin-left:10px;background:var(--panel);border:1.5px solid var(--hair);color:var(--ink2);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .oppbtn[aria-pressed="true"]{background:#fbeaea;border-color:#cc9a9a;color:#9e2b2b;}
  .opp-line{stroke:#9e2b2b;stroke-width:2.2;stroke-dasharray:5 4;opacity:.92;}
  .opp-pill{fill:#fbeaea;stroke:#d7a6a6;stroke-width:1;}
  .opp-lab{fill:#9e2b2b;font-size:10.5px;font-weight:700;dominant-baseline:central;}
  .opps{max-width:1000px;margin:22px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:12px;}
  .oppsHead{font-size:12px;letter-spacing:.16em;color:#9e2b2b;text-transform:uppercase;font-weight:700;}
  .oppcard{background:var(--panel);border:1.5px solid var(--hair);border-left:4px solid #9e2b2b;border-radius:0 12px 12px 0;padding:13px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .opphead{font-family:"Songti SC","STSong",serif;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.02em;}
  .opphead .vs{color:#9e2b2b;margin:0 8px;}
  .oppq{font-size:13px;color:var(--ink2);margin:5px 0 10px;line-height:1.6;}
  .opprow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .opprow .pole{font-size:11px;font-weight:700;color:#9e2b2b;flex:none;width:56px;}
  .pchips{display:flex;flex-wrap:wrap;gap:6px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

<script>
const SCHOOLS={"greek":{"name":"古希腊哲学","hex":"#f0b93f","blurb":"把追问从「世界由什么构成」转向「人该如何生活」，搭起西方哲学的地基。"},"scholastic":{"name":"中世纪哲学","hex":"#c98a4e","blurb":"从奥古斯丁到阿奎那：用理性为信仰重装骨架，也追问时间、自我与存在。"},"rationalism":{"name":"理性主义","hex":"#5f97e6","blurb":"知识的根基在理性——凭清晰明确的推理抵达确定。"},"empiricism":{"name":"经验主义","hex":"#4fb877","blurb":"知识的根基在经验——一切观念最终都来自感官。"},"idealism":{"name":"德国观念论","hex":"#a986e0","blurb":"在康德的分水岭上重建体系，追问认识与精神本身。"},"will":{"name":"意志与生命","hex":"#f08a45","blurb":"理性之下，是盲目的意志与自我超越的生命冲动。"},"material":{"name":"唯物·社会批判","hex":"#e0574a","blurb":"推动历史的不是精神，而是物质生产与阶级。"},"existential":{"name":"现象学·存在主义","hex":"#e368a0","blurb":"放下成见回到经验本身，追问存在、自由与意义。"},"analytic":{"name":"分析哲学","hex":"#33b7b7","blurb":"哲学传统上纠缠不清的许多难题，其实是语言用错了。"},"psy":{"name":"精神分析·后结构","hex":"#c264a6","blurb":"理性之下有潜意识，真理背后有权力——20世纪对「主体」与「意义」的再追问。这条线正是文化研究与「投射」框架的源头。"},"structuralism":{"name":"结构主义·符号学","hex":"#1f8fa8","blurb":"意义不在实体而在关系与差异——把语言的结构模型推广到神话、文化与符号。"},"media":{"name":"媒介·批判理论","hex":"#4f6d99","blurb":"从马克思长出的批判传统：法兰克福学派（灵光、文化工业、公共领域）与英国文化研究（编码/解码、文化即生活方式），加上景观与拟像。这正是你研究注意力与景观的理论祖源。"}};
const COLS=["greek","scholastic","rationalism","empiricism","idealism","will","material","existential","analytic","structuralism","psy","media"];
const COLHEAD=["古希腊","中世纪","近代","德国古典","十九世纪","二十世纪","结构主义·符号学","精神分析·后结构","法兰克福批判理论","媒介·文化研究"];
const LAYOUT=[["socrates","plato","aristotle"],["augustine","anselm","aquinas"],["descartes","spinoza","leibniz","locke","berkeley","hume"],["kant","hegel"],["schopenhauer","nietzsche","kierkegaard","marx"],["frege","russell","wittgenstein","husserl","heidegger","sartre"],["saussure","levistrauss","barthes"],["freud","jung","lacan","foucault","derrida"],["benjamin","adorno","habermas"],["mcluhan","williams","hall","debord","baudrillard"]];
const P=[{"id":"socrates","nm":"苏格拉底","en":"Socrates","b":"前469","d":"前399","s":"greek","sym":"❓","turn":"伦理转向","ess":"我唯一知道的，就是我一无所知。","ctx":"在他之前，希腊哲人（「自然哲学家」）忙于追问世界由什么构成——水、火、原子。苏格拉底把这套目光整个掉转：真正要紧的不是宇宙的质料，而是「人应当如何生活」。","ideas":["<b>反诘法（elenchus）</b>：他从不宣讲，只提问。假装无知地追问对方「什么是勇敢」「什么是正义」，一层层逼出定义里的自相矛盾，让人从「自以为知」跌回「承认不知」。而这个「承认无知」不是终点，恰是求知的真正起点。","<b>德性即知识</b>：他主张没有人明知善而故意作恶——作恶只因不知何为真正的善。于是道德问题被转化为认识问题：只要把「好」看清楚，人自然会趋向它。","<b>照料你的灵魂</b>：财富、名声都只是手段，灵魂的良善才是目的。这是他给雅典人的核心劝告，也把哲学从思辨引向了如何为人。"],"legacy":"<b>伦理转向</b>——他是西方哲学的第一个拐点。在他之后，「人该如何生活」「什么是正义与幸福」成了哲学不可回避的中心。他述而不作，却通过柏拉图的对话录塑造了整个传统；连他从容赴死、拒绝逃狱而饮鸩，本身都成了「哲学地活、哲学地死」的范本。","from":[],"to":["plato"],"works":["述而不作，思想见于柏拉图对话录"],"worksPlain":true,"quote":"未经省察的人生，不值得过。"},{"id":"plato","nm":"柏拉图","en":"Plato","b":"前427","d":"前347","s":"greek","sym":"☀️","ess":"眼前的世界只是影子，真实在别处。","ctx":"老师苏格拉底被雅典处死，柏拉图对现实政治彻底失望，转而追问：如果感官世界如此易变、易朽、易骗，那「真正的知识」到底以什么为对象？","ideas":["<b>理念论（相论）</b>：眼前每一张床都会朽坏，但「床之所以为床」的那个完美原型不朽。柏拉图称之为「理念」。可感之物只是理念的摹本，靠「分有」理念才成其为自己。真正的知识只关乎理念，感官只能给出意见。","<b>洞穴寓言</b>：人如同被锁在洞中、只能看见火光投在墙上的影子的囚徒，误把影子当真实。哲学家是那个挣脱枷锁、走出洞穴、看见真正阳光（善的理念）的人——也因此，回洞里说真话时反被当成疯子。","<b>灵魂三分与理想国</b>：灵魂分理性、意气、欲望三部分，正义即三者各安其位。城邦同理，应由真正看见理念的「哲学王」来统治。"],"legacy":"他把苏格拉底零散的追问建成了第一个完整的哲学体系，几乎为后世每个大问题都提供了初始版本——认识论、形而上学、伦理、政治、美学。怀特海那句「整部西方哲学不过是对柏拉图的一系列脚注」，说的正是这份奠基性。","from":["socrates"],"to":["aristotle","augustine"],"works":["理想国","会饮篇","斐多篇"],"quote":"除非哲学家成为王，否则城邦的灾难无从止息。"},{"id":"aristotle","nm":"亚里士多德","en":"Aristotle","b":"前384","d":"前322","s":"greek","sym":"🔬","ess":"形式不在别处，就在事物之中。","ctx":"他在柏拉图学园学了二十年，却始终无法接受「理念在另一个世界」：如果床的本质在天上，它怎么解释眼前这张具体的木床？","ideas":["<b>形式内在于质料</b>：他把理念从天上拉回地面。任何事物都是「质料＋形式」的结合——木头是质料，「床的结构」是形式，本质就在事物自身之中，不在别处。","<b>四因说</b>：要真正解释一个东西，须问四种「因」：质料因（用什么做）、形式因（是什么结构）、动力因（谁使它成形）、目的因（为了什么）。尤其「目的因」，让他的世界观带上强烈的目的论色彩——万物都朝各自的目的生长。","<b>逻辑学的创立</b>：他第一个系统研究「有效推理」的形式（三段论），奠定了此后两千年的逻辑框架。","<b>德性即中道</b>：勇敢是鲁莽与怯懦之间的中点，慷慨是挥霍与吝啬之间的中点。幸福（eudaimonia）不是一时快乐，而是「灵魂合乎德性的实现活动」。"],"legacy":"他是第一个把知识分门别类的百科全书式头脑——物理、生物、伦理、政治、诗学各成一科。经阿拉伯与拉丁世界的传承，他成了中世纪口中的「哲学家」（the Philosopher），直到近代科学革命才被部分推翻。柏拉图向上（理念）、亚里士多德向下（经验），这两个方向的张力贯穿整部哲学史。","from":["plato"],"to":["aquinas"],"works":["形而上学","尼各马可伦理学","工具论","政治学"],"quote":"求知，是人类的本性。"},{"id":"augustine","nm":"奥古斯丁","en":"Augustine","b":"354","d":"430","s":"scholastic","sym":"🕯️","ess":"别向外求，真理住在你心里。","ctx":"罗马帝国正在崩塌，基督教刚成为主流。奥古斯丁年轻时放浪、追随过摩尼教，皈依后要解决一个难题：如何用希腊哲学的语言，为新兴的基督教信仰奠定理性根基？","ideas":["<b>新柏拉图主义 × 基督教</b>：他把柏拉图的「理念世界」接到上帝身上——永恒不变的真理即存于神心。可感世界的流变由此获得一个超越的锚点。","<b>向内转的自我</b>：《忏悔录》以第一人称剖白自己的欲望、悔恨与皈依，开创了「内省式写作」。「不要向外走，回到你自己」——他比笛卡尔早一千年，就在内心里寻找确定性。","<b>时间之问</b>：他追问「时间是什么」，给出著名回答：过去靠记忆、未来靠期待，都只存在于当下的心灵之中。这是最早对「主观时间」的深刻分析。","<b>原罪与恩典</b>：人靠自身无法为善，唯赖神的恩典。《上帝之城》据此写出一部基督教的历史哲学。"],"legacy":"他是古代晚期到中世纪之间最关键的桥。此后一千年的西方思想几乎都在他的框架里运转；而他那个「向内确证自我」的姿态，又悄悄预示了近代主体哲学的到来。","from":["plato"],"to":["anselm"],"works":["忏悔录","上帝之城","论三位一体"],"quote":"时间究竟是什么？没人问我时我知道，一问我便茫然。"},{"id":"anselm","nm":"安瑟伦","en":"Anselm","b":"1033","d":"1109","s":"scholastic","sym":"🧠","ess":"上帝，是那「无法设想有比之更大者」的存在。","ctx":"中世纪盛期，经院哲学兴起，人们开始尝试用严格的理性论证去「证明」信仰的内容。","ideas":["<b>本体论证明</b>：他给出哲学史上最著名也最诡异的一个论证——上帝是「可设想的最大存在」；若它只存在于观念中而不存在于现实中，那就还能设想一个更大的（现实中也存在的），矛盾。故上帝必然存在。这是纯粹从概念本身推出存在，不诉诸任何经验。","<b>信仰寻求理解</b>：他不是先怀疑再求证，而是「我信，所以我要理解」——信仰在先，理性用来照亮已信之物。"],"legacy":"本体论证明此后被反复攻击（康德那句「存在不是一个谓词」是最致命的一击），又反复复活（笛卡尔、莱布尼茨都用过它的变体）。安瑟伦示范了经院哲学的野心：把信仰交给逻辑去检验。","from":["augustine"],"to":["aquinas"],"works":["宣讲篇","神为何化身为人"],"quote":"我并非因理解而信仰，而是因信仰而理解。"},{"id":"aquinas","nm":"阿奎那","en":"Aquinas","b":"1225","d":"1274","s":"scholastic","sym":"✝️","ess":"信仰与理性，是通往同一真理的两条路。","ctx":"13世纪，亚里士多德的著作经阿拉伯世界重新传入欧洲，其「以理性与经验解释自然」的立场，与基督教信仰形成巨大张力。阿奎那的任务，是调和二者。","ideas":["<b>用亚里士多德重装神学</b>：他借亚氏的「质料—形式」「潜能—现实」等概念，为基督教教义搭起一套精密的理性骨架，写成鸿篇《神学大全》。","<b>信仰与理性并行不悖</b>：理性能凭自然之光认识许多真理（如上帝存在），启示则补充理性够不到的部分（如三位一体）。两者不冲突，因为都源于同一位上帝。","<b>五路论证</b>：他从运动、因果、偶然性、等级、目的五个经验事实出发，层层推向「必有一个第一推动者／终极原因」，即上帝。","<b>自然法</b>：道德律并非全靠启示，人凭理性即可认识基本的善——这为后世的法哲学与人权观念埋下了种子。"],"legacy":"他是中世纪思想的集大成者，天主教官方哲学至今仍以他为宗（托马斯主义）。他证明了信仰可以与最严格的理性共存——这既是中世纪的顶峰，也在无意中为「理性独立于信仰」的近代铺了路。","from":["aristotle","anselm"],"to":[],"works":["神学大全","反异教大全"],"quote":"恩典不摧毁自然，而是成全自然。"},{"id":"descartes","nm":"笛卡尔","en":"Descartes","b":"1596","d":"1650","s":"rationalism","sym":"🤔","turn":"认识论转向","ess":"在一切崩塌之后，那个怀疑的「我」依然站立。","ctx":"近代科学革命刚起，旧的经院权威被动摇，一切似乎都可怀疑。笛卡尔想找到一块任何怀疑都冲不垮的地基，好在上面重建全部知识。","ideas":["<b>方法论的怀疑</b>：他决定把一切可被怀疑的都先当作假的搁置——感官会骗人，梦难辨真假，甚至设想有个「恶魔」在系统地欺骗我。层层剥除之后，看看还剩下什么。","<b>我思故我在</b>：剩下的正是——当我怀疑时，「我在怀疑」这件事本身无法怀疑；而怀疑即思维，思维必有一个思维者。于是「我思故我在」成了不可动摇的第一原理。哲学的重心从此<b>转向主体</b>：先确立认识者，再谈被认识的世界。","<b>心物二元论</b>：他把世界切成两种实体——不占空间的「思维」（心灵）与占空间的「广延」（物质）。这一刀带来了此后三百年绕不开的「身心问题」。"],"legacy":"<b>认识论转向</b>——继苏格拉底之后的第二个大拐点。在他之前，哲学首先问「世界是什么」；从他开始，哲学首先问「我凭什么能确知任何东西」。认识论跃居第一位，主体登上舞台。他因此被称为「近代哲学之父」。","from":[],"to":["spinoza","leibniz"],"works":["第一哲学沉思集","方法谈"],"quote":"我思故我在。"},{"id":"spinoza","nm":"斯宾诺莎","en":"Spinoza","b":"1632","d":"1677","s":"rationalism","sym":"♾️","ess":"神即自然，万物只是它的样态。","ctx":"笛卡尔留下一个难题：心与物两种实体如何互动？斯宾诺莎的解法极端而彻底——干脆取消二元。","ideas":["<b>一元论 / 神即自然</b>：宇宙只有一个无限实体，你可以叫它「神」，也可以叫它「自然」（Deus sive Natura）。心灵与物质不是两种东西，而是这唯一实体的两种「属性」。万物都是它的样态。","<b>几何学式的伦理学</b>：他仿照欧几里得，用定义、公理、命题一步步推演《伦理学》，试图像证明几何定理那样证明「人应如何生活」。","<b>自由即理解必然</b>：万物都被因果必然性决定，「自由意志」是错觉。真正的自由不是挣脱必然，而是通过理性<b>理解</b>这必然，从而不再被激情奴役，达到内心的宁静。"],"legacy":"他因泛神论被逐出犹太社群、著作遭禁，生前近乎隐者，靠磨镜片为生。但后世（尤其德国观念论与当代生态思想）不断回到他：把神与自然等同、以理性抵达平静，这种冷峻而彻底的世界观有一种独特的现代性。","from":["descartes"],"to":[],"works":["伦理学","神学政治论"],"quote":"不哭，不笑，只求理解。"},{"id":"leibniz","nm":"莱布尼茨","en":"Leibniz","b":"1646","d":"1716","s":"rationalism","sym":"⚛️","ess":"世界由无数不可分的心灵微粒和谐组成。","ctx":"同样面对笛卡尔的身心难题，又不满斯宾诺莎把一切化为一个实体。莱布尼茨要一个既多元、又和谐的世界。","ideas":["<b>单子论</b>：世界的终极构成不是物质微粒，而是无数不可分的、精神性的单元——「单子」。每个单子都是一个封闭的、映照整个宇宙的视角，「没有窗户」，彼此并不真正相互作用。","<b>预定和谐</b>：既然单子互不作用，世界为何看起来协调一致？因为上帝在创世之初就把所有单子调成了和谐——像无数各自走时却永远同步的钟。","<b>充足理由律</b>：凡存在之物、凡发生之事，必有一个「为什么如此而非那样」的充分理由。由此他论证：上帝在无数可能世界中，选择创造了「最好的一个」。"],"legacy":"他是最后一位百科全书式的通才——独立于牛顿发明微积分、设计计算机器、构想通用逻辑语言。他的「可能世界」概念，在今天的逻辑与语义学里重获新生。","from":["descartes"],"to":[],"works":["单子论","神义论"],"quote":"这是一切可能世界中最好的一个。"},{"id":"locke","nm":"洛克","en":"Locke","b":"1632","d":"1704","s":"empiricism","sym":"📄","ess":"心灵初生，是一块白板。","ctx":"理性主义者说某些观念是「天赋」的、与生俱来。洛克站在对面：如果真有天赋观念，为何小孩与「未开化者」没有？知识必须另有来源。","ideas":["<b>白板说</b>：心灵初生如一张白纸，没有任何先天内容。一切观念都来自后天——外部的「感觉」与内心的「反省」。经验是知识唯一的源头。","<b>第一性质与第二性质</b>：广延、形状、运动是物体本身就有的（第一性质）；颜色、气味、声音则是物体在我们感官中激起的效果（第二性质），并不真在物体里。","<b>政治哲学</b>：他把经验主义的谨慎带进政治——天赋人权（生命、自由、财产）、政府源于被统治者的同意、有限政府与分权。这些直接写进了后来的美国《独立宣言》。"],"legacy":"他既是经验主义传统的开创者，又是自由主义政治的奠基人。近代关于「知识来自经验」和「权力来自同意」这两条现代性主轴，都可追溯到他。","from":[],"to":["berkeley"],"works":["人类理解论","政府论"],"quote":"没有人的知识，能超出他的经验。"},{"id":"berkeley","nm":"贝克莱","en":"Berkeley","b":"1685","d":"1753","s":"empiricism","sym":"🫧","ess":"存在，就是被感知。","ctx":"洛克说第二性质只在心中，第一性质在物中。贝克莱追问：你凭什么确定「物」本身存在？你能想到的一切，不都只是知觉吗？","ideas":["<b>存在即被感知</b>（esse est percipi）：所谓「物质」，我们能接触的从来只是一堆知觉——颜色、硬度、声音。除去全部知觉，「物质本身」是一个我们根本无法设想的空概念。所以，物就是被感知的观念，不存在「未被感知的物质」。","<b>主观唯心论</b>：既然物＝观念，那没人看时事物是否还在？贝克莱答：上帝始终在感知一切，万物因此持续存在。他用上帝兜住了整个物理世界。"],"legacy":"他把经验主义推到了一个惊人而自洽的极端：彻底否认独立于心灵的物质。这一步既是经验论的必然延伸，也直接逼出了休谟——如果连物质都能这样消解，那「自我」「因果」是否也一样可疑？","from":["locke"],"to":["hume"],"works":["人类知识原理","海拉斯与斐洛诺斯对话三篇"],"quote":"存在，就是被感知。"},{"id":"hume","nm":"休谟","en":"Hume","b":"1711","d":"1776","s":"empiricism","sym":"🔗","ess":"你从未见过「因果」，只见过一件事跟着另一件。","ctx":"沿着洛克、贝克莱的经验主义往下走，休谟决定不留情面：凡是经验里找不到根据的观念，一律追查到底。","ideas":["<b>因果只是习惯</b>：我们说「A导致B」，但经验里只观察到「A之后总是B」，从未观察到那根连接二者的「必然性」。所谓因果，不过是心灵在反复经验后形成的<b>习惯性期待</b>，是心理事实，不是世界中的客观联系。","<b>归纳问题</b>：我们凭什么相信「过去如此，未来也将如此」？这个信念本身无法被证明——用「过去经验一直可靠」来论证，恰恰又预设了要证明的东西。科学赖以立足的归纳，其实没有理性根基。","<b>实然推不出应然</b>：从一堆「是什么」的事实，逻辑上推不出任何「应当如何」的价值结论。事实与价值之间有一道鸿沟（休谟之叉）。","<b>自我也是幻觉</b>：向内看，你只找到一连串流动的知觉，从来找不到那个恒常不变的「我」。自我不过是知觉的一束。"],"legacy":"他把经验主义推到了怀疑论的悬崖：因果、自我、归纳这些看似最牢靠的东西，全被抽掉了理性根基。正是这记重击，把康德「从独断论的迷梦中惊醒」——整个德国观念论都是对休谟的回应。","from":["berkeley"],"to":["kant"],"works":["人性论","人类理解研究"],"quote":"理性是、且只应是激情的奴隶。"},{"id":"kant","nm":"康德","en":"Kant","b":"1724","d":"1804","s":"idealism","sym":"👓","turn":"批判转向 · 分水岭","ess":"不是认识去符合世界，而是世界符合认识。","ctx":"休谟证明了因果、必然性在经验里找不到根据，理性主义的独断因此崩塌；可科学（牛顿力学）又分明是可靠的普遍知识。康德要回答：这样的知识究竟如何可能？","ideas":["<b>哥白尼式革命</b>：以往都假定「认识必须符合对象」。康德反过来——是<b>对象必须符合我们的认识结构</b>。就像戴着一副摘不下的有色眼镜看世界，我们看到的一切都已被眼镜（心灵的先天形式）塑造过。","<b>先天综合判断</b>：时间、空间不是外在的客观容器，而是我们<b>直观的先天形式</b>；因果、实体等「范畴」是<b>知性</b>加给经验的结构。正因这套结构人人共有、且先于经验，数学与物理才能既普遍必然、又关乎经验。","<b>现象与物自体</b>：代价是——我们只能认识经过这套框架塑造的<b>现象</b>，而事物「自身是什么」（物自体）永远在认识的彼岸。理性一旦越界去谈灵魂、宇宙、上帝，就会陷入无解的二律背反。","<b>绝对命令</b>：在道德上他给出不依赖后果的法则：只按你愿意它成为普遍法则的准则去行动；永远把人当作目的，而非纯粹的手段。自由与尊严由此奠基。"],"legacy":"<b>批判转向 · 分水岭</b>——他调停了理性主义与经验主义之争，把哲学的问题从「世界是什么／我能否认识」推进到「<b>认识本身如何可能、它的边界在哪</b>」。此后整部哲学在他这里分流：一路沿着「物自体够不到、但精神仍要展开」走向黑格尔与欧陆，一路沿着「划清认识的界限」走向分析。康德之后，无人能绕过康德。","from":["hume"],"to":["hegel","schopenhauer"],"works":["纯粹理性批判","实践理性批判"],"quote":"头顶的星空，心中的道德律。"},{"id":"hegel","nm":"黑格尔","en":"Hegel","b":"1770","d":"1831","s":"idealism","sym":"🌀","ess":"历史，是绝对精神一步步认识自己的过程。","ctx":"康德留下一道裂缝：现象与物自体二分，认识被永远挡在事物之外。黑格尔要弥合它——把那个够不到的「自在之物」重新纳入精神自身的运动。","ideas":["<b>辩证法</b>：真理不是静止的命题，而是一个过程。每一个立场（正题）都内含自身的对立面（反题），二者的冲突在更高层次上被扬弃、统合（合题），如此层层上升。矛盾不是错误，而是发展的动力。","<b>绝对精神的自我展开</b>：整个宇宙与历史，是「绝对精神」逐步认识自己的过程。人类的艺术、宗教、哲学，都是精神走向自我透明的阶段。历史因此是理性的、有方向的。","<b>主奴辩证法</b>：自我意识必须通过他者的承认才能成立。主奴的生死斗争中，反倒是通过劳动改造世界的奴隶，获得了真正的自我意识——这一节深刻影响了马克思与后来的承认政治。"],"legacy":"他建成了西方哲学史上最庞大、最雄心勃勃的体系，试图把自然、历史、精神纳入一个统一的理性运动。他之后的思想几乎都以「反黑格尔」的姿态展开——马克思把他倒过来，克尔凯郭尔嘲讽他遗忘了活生生的个体。造他的反，本身成了19世纪的主题。","from":["kant"],"to":["marx","kierkegaard"],"works":["精神现象学","逻辑学"],"quote":"密涅瓦的猫头鹰，在黄昏起飞。"},{"id":"schopenhauer","nm":"叔本华","en":"Schopenhauer","b":"1788","d":"1860","s":"will","sym":"🎭","ess":"世界的内核，是盲目而永不满足的意志。","ctx":"他接受康德的现象／物自体二分，却大胆地给那个「物自体」起了个名字——而且是个令人不安的名字。","ideas":["<b>世界作为意志</b>：康德说物自体不可知，叔本华说——不，我们能从内部直接体验到它，那就是<b>意志</b>：一种盲目的、无目的、永不满足的生命冲动。我们看到的整个世界（表象），不过是这股意志的外化。","<b>痛苦的钟摆</b>：意志的本质是欲求，欲求即匮乏即痛苦；一旦满足，随之而来的是无聊。于是人生在<b>痛苦与无聊</b>之间来回摆动，幸福只是欲望短暂的间歇。","<b>解脱之路</b>：暂时的出口是艺术（尤其音乐，它直接是意志的摹本），让人从欲求中抽身静观；彻底的出口是禁欲，否定意志本身——这里他吸收了印度哲学。"],"legacy":"他是第一个把非理性的「意志」置于理性之上的西方大哲，也是第一个认真吸收东方思想的人。他直接点燃了尼采，又通过「意识之下有盲目冲动」这一洞见，预示了弗洛伊德的潜意识。他那一支，是「理性并非主人」这一现代怀疑的源头之一。","from":["kant"],"to":["nietzsche","freud"],"works":["作为意志和表象的世界"],"quote":"人生如钟摆，在痛苦与无聊间摆动。"},{"id":"kierkegaard","nm":"克尔凯郭尔","en":"Kierkegaard","b":"1813","d":"1855","s":"existential","sym":"🪜","ess":"真理是主观的——是你敢不敢纵身一跃。","ctx":"面对黑格尔那座吞没一切的宏大体系，克尔凯郭尔感到一种愤怒：体系里有一切，唯独没有那个正在焦虑、正在选择、终将死去的「我」这个活人。","ideas":["<b>存在先于体系</b>：真理不是一套客观命题，而是「你如何存在」。对个体生死攸关的真理是<b>主观的</b>——它要求你投入、承诺、去活，而不只是认识。","<b>信仰的一跃</b>：人生有审美、伦理、宗教三个阶段。走向最高的宗教阶段，靠的不是理性论证，而是明知荒谬仍纵身一跃的信仰（他以亚伯拉罕献子为例）。这是理性无法担保的「非此即彼」的抉择。","<b>焦虑与绝望</b>：焦虑是面对自由时的眩晕——因为你意识到「一切皆有可能」，而选择无可推卸。"],"legacy":"他生前默默无闻，20世纪却被尊为<b>存在主义之父</b>。他把哲学的重心从「体系」扳回「个体的存在处境」，直接哺育了海德格尔与萨特。他与尼采从两个方向（一个走向信仰，一个走向「上帝已死」），共同掀翻了体系哲学。","from":["hegel"],"to":["heidegger","sartre"],"works":["恐惧与颤栗","非此即彼"],"quote":"生活只能倒着理解，却必须正着去活。"},{"id":"marx","nm":"马克思","en":"Marx","b":"1818","d":"1883","s":"material","sym":"⚒️","ess":"问题不在解释世界，而在改变它。","ctx":"青年马克思是黑格尔的信徒，但很快转向：黑格尔说历史是「精神」的展开，可现实里推动一切的，分明是工厂、饥饿与阶级。","ideas":["<b>历史唯物主义</b>：他把黑格尔「倒过来」——不是观念决定物质，而是<b>物质生产方式决定社会与观念</b>。经济基础（生产力与生产关系）决定上层建筑（法律、政治、宗教、哲学）。","<b>阶级斗争</b>：迄今一切社会的历史都是阶级斗争的历史。生产力发展到与旧生产关系冲突时，革命就会爆发，推动社会形态更替。","<b>异化</b>：在资本主义下，工人与自己的劳动产品、劳动过程、乃至人的类本质相分离——劳动本应是自我实现，却沦为谋生的苦役，人被自己创造之物所支配。","<b>商品拜物教</b>：人与人的社会关系，被颠倒地表现为物与物（商品、货币）的关系，社会性的东西被误认作物的自然属性。"],"legacy":"他把哲学从解释世界推向<b>改变世界</b>，其思想成为20世纪最具现实力量的理论——塑造了革命、国家与整整一个阵营，也深刻改造了历史学、社会学与文化批判。无论褒贬，他都是少数真正「改变了世界」的哲学家。","from":["hegel"],"to":["benjamin","adorno","debord","williams"],"works":["资本论","共产党宣言","1844年经济学哲学手稿"],"quote":"哲学家们只是解释世界，问题在于改变世界。"},{"id":"nietzsche","nm":"尼采","en":"Nietzsche","b":"1844","d":"1900","s":"will","sym":"🔨","ess":"上帝已死——现在，价值要由你自己创造。","ctx":"上帝——那个两千年来支撑西方全部价值、道德与意义的地基——在科学与世俗化的冲击下，实际上已不再被真心相信。尼采要人正视这场地震的后果。","ideas":["<b>「上帝已死」</b>：这不是欢呼，而是诊断与警告。支撑善恶、真假、意义的那个超越根基塌了；若不重建价值，随之而来的将是虚无主义。","<b>权力意志</b>：生命的根本冲动不是求生存、也不是求快乐，而是自我扩张、自我超越、不断变强。一切价值都可从「是增强还是削弱生命」来重估。","<b>主人道德与奴隶道德</b>：他做「道德的谱系学」——追问道德概念的来历。「善／恶」的对立源于弱者对强者的怨恨（奴隶道德），把谦卑、忍让美化为德性。他要人重估这套价值。","<b>永恒轮回与超人</b>：设想你这一生将一模一样地无限重演——你还愿意吗？敢对生命如此说「是」的人，就是能自我立法、自创价值的<b>超人</b>。"],"legacy":"他不建体系，而是抡起锤子，为20世纪的全部怀疑埋下引信。他被存在主义、精神分析（潜意识）、福柯（谱系学与权力）反复继承，是从「意志与生命」这条线通往整个后现代思想的枢纽。","from":["schopenhauer"],"to":["heidegger","foucault"],"works":["查拉图斯特拉如是说","善恶的彼岸","道德的谱系"],"quote":"上帝已死，而我们杀死了他。"},{"id":"frege","nm":"弗雷格","en":"Frege","b":"1848","d":"1925","s":"analytic","sym":"➗","ess":"想说清哲学，先造一套精确的逻辑语言。","ctx":"19世纪末，数学基础出现危机，人们发现日常语言与旧逻辑太模糊，无法承载严格推理。弗雷格要为思想造一套精确的工具。","ideas":["<b>现代逻辑的奠基</b>：他发明了量词与变元（「所有」「存在」），第一次让「所有S都是P」这类命题可被形式化地精确处理，一举超越了统治两千年的亚里士多德三段论。","<b>涵义与指称</b>：他区分一个词的「指称」（它指向的对象）与「涵义」（呈现该对象的方式）。「晨星」与「暮星」指称相同（都是金星），涵义却不同——这解释了为什么「晨星是暮星」是有信息量的发现，而非空洞的同义反复。","<b>逻辑主义</b>：他主张数学可以完全还原为逻辑，试图用纯逻辑推出全部算术。（这个宏图后被罗素发现的悖论击中。）"],"legacy":"他是<b>分析哲学的源头</b>。「先把语言与逻辑弄清楚，再谈哲学问题」这一整套方法，都从他这里发端，直接塑造了罗素与维特根斯坦。","from":[],"to":["russell","wittgenstein"],"works":["概念文字","算术基础"],"quote":"词，只有在句子的语境中才有意义。"},{"id":"husserl","nm":"胡塞尔","en":"Husserl","b":"1859","d":"1938","s":"existential","sym":"👁️","ess":"放下一切成见，回到经验本身去看。","ctx":"心理主义盛行，人们想把逻辑、意义都还原成大脑的心理过程。胡塞尔要为「意义」和「经验本身」找回一个严格、不被自然科学化约的描述方式。","ideas":["<b>回到事物本身</b>：不要一上来就用理论、成见去套经验，而是精确地<b>描述</b>现象如何在意识中呈现。哲学应成为一门关于意识经验的严格科学。","<b>悬置（epoché）</b>：把「外部世界是否真实存在」这个自然态度的判断先<b>加括号</b>搁置起来，只专注于经验本身是怎样被给予的。","<b>意向性</b>：意识永远是「关于某物」的意识——知觉总是知觉某物，恐惧总是恐惧某事。意识与对象不可分地关联着，这是现象学的核心结构。"],"legacy":"他创立的<b>现象学</b>，成为20世纪欧陆哲学的方法母体。海德格尔、萨特、梅洛-庞蒂，乃至后来的德里达，都从他出发（再各自背离他）。","from":[],"to":["heidegger"],"works":["逻辑研究","纯粹现象学通论"],"quote":"回到事物本身！"},{"id":"russell","nm":"罗素","en":"Russell","b":"1872","d":"1970","s":"analytic","sym":"🧩","ess":"用逻辑的手术刀，切开语言制造的假问题。","ctx":"弗雷格的逻辑工具已就位，罗素既想用它为数学奠基，也想用它清洗哲学里那些被语言制造出来的假问题。","ideas":["<b>摹状词理论</b>：像「当今的法国国王是秃头」这种句子——法国根本没有国王，它是真是假？罗素用逻辑分析证明：它其实断言「存在唯一一个当今法国国王且他秃头」；由于并不存在这样的人，整句为假，而非无意义。语言的表层形式骗了我们，逻辑分析还原了真正的结构。","<b>罗素悖论与逻辑原子论</b>：他发现「所有不包含自身的集合的集合」会导致矛盾，动摇了弗雷格的逻辑主义。他主张世界与语言都可分析为最基本的「逻辑原子」。","<b>《数学原理》</b>：他与怀特海耗费多年，试图从逻辑公理推出全部数学（著名地用了几百页才证明「1+1=2」）。"],"legacy":"他把「逻辑分析」树立为哲学的核心方法，是分析哲学的奠基者之一，也是维特根斯坦的引路人。他还是20世纪重要的公共知识分子（和平主义、《西方哲学史》），把哲学带向公众。","from":["frege"],"to":["wittgenstein"],"works":["数学原理","哲学问题","西方哲学史"],"quote":"对爱的渴望、对知识的追求、对苦难难以承受的同情，支配了我的一生。"},{"id":"wittgenstein","nm":"维特根斯坦","en":"Wittgenstein","b":"1889","d":"1951","s":"analytic","sym":"💬","turn":"语言转向","ess":"前期：世界的界限即语言的界限；后期：意义即用法。","ctx":"他师从罗素，一生像两个人：前期要为语言划定绝对的界限，后期又亲手推翻了自己前期的整座大厦。","ideas":["<b>前期·语言图像论</b>（《逻辑哲学论》）：命题之所以有意义，是因为它像一幅<b>图画</b>一样，映射了世界的逻辑结构。语言的界限就是世界的界限。凡能说的都能说清楚；至于伦理、人生意义、神——它们不可说，只能显示。全书收束于那句「<b>凡不可说的，应当保持沉默</b>」。","<b>后期·语言游戏</b>（《哲学研究》）：他推翻了图像论。语言不是映射世界的图画，而是嵌在生活中的活动——下命令、开玩笑、祈祷、报数……各是一种「<b>语言游戏</b>」。一个词的<b>意义就在于它的用法</b>，脱离具体场景去问「意义本身」是徒劳的。","<b>哲学是治疗</b>：由此，绝大多数哲学难题不是待解的真问题，而是语言「空转」时产生的错觉、是「智力被语言迷惑」的病。哲学的任务不是建体系，而是把这些困惑<b>疏解</b>掉。"],"legacy":"<b>语言转向</b>——20世纪两大拐点之一（分析这一侧）。康德之后的分析支流在他这里达到顶点：哲学的首要工作，不再是认识世界，而是<b>看清语言</b>。许多千年难题，被重新诊断为语言的误用。","from":["frege","russell"],"to":[],"works":["逻辑哲学论","哲学研究"],"quote":"凡不可说的，应当保持沉默。"},{"id":"heidegger","nm":"海德格尔","en":"Heidegger","b":"1889","d":"1976","s":"existential","sym":"⏳","turn":"存在转向","ess":"我们遗忘了最该问的问题：「存在」究竟是什么？","ctx":"现象学老师胡塞尔教他描述意识，但海德格尔发现，整个西方哲学从柏拉图起就忙于研究各种「存在者」（具体的东西），却遗忘了最根本的问题：<b>「存在」本身</b>是什么意思？","ideas":["<b>存在之问的重提</b>：我们随口说桌子「是」、人「是」、上帝「是」，但「是／存在」到底意味着什么？这个被遗忘两千年的问题，是《存在与时间》的出发点。","<b>此在（Dasein）</b>：要追问存在，得从那个唯一会追问存在的存在者入手——即人。他不用「人」「主体」这些旧词，而称之为「此在」，因为人的独特在于：它的存在对它自己成了问题。","<b>在世存在</b>：人不是先有个孤立的心灵、再面对外部世界。人一开始就已被<b>抛入</b>一个由工具、他人、意义交织的世界，「在世界之中存在」是更原初的处境。","<b>向死而生与本真</b>：日常中人总在「沉沦」——随大流、活成「人们」（das Man）都那样活的样子。唯有直面自己终将<b>死亡</b>这一最本己、无法替代的可能性，此在才可能从沉沦中被唤醒，本真地承担起自己的存在。"],"legacy":"<b>存在转向</b>——20世纪另一侧的拐点（欧陆这一支）。他把哲学从认识论、从对「存在者」的研究，扳回对「存在本身」与人的生存处境的追问。萨特的存在主义、伽达默尔的诠释学、乃至德里达的解构，都从他这里生长出去。（他与纳粹的牵连，则是其思想无法回避的阴影。）","from":["husserl","kierkegaard","nietzsche"],"to":["sartre","derrida"],"works":["存在与时间"],"quote":"语言，是存在之家。"},{"id":"sartre","nm":"萨特","en":"Sartre","b":"1905","d":"1980","s":"existential","sym":"🕊️","ess":"人没有预定本质——你先存在，再造就自己。","ctx":"他继承海德格尔对生存的分析，却转向一个更直接、更激烈的主题：自由。若没有上帝、没有预定的人性，人该如何自处？","ideas":["<b>存在先于本质</b>：一把裁纸刀是先有「用途」（本质）才被造出来的；而人不同，人先<b>存在</b>（被抛到世上），然后才通过自己的选择去<b>造就</b>自己是谁。没有神预先规定的人性。","<b>被判处自由</b>：正因没有既定本质，人在每个处境里都得选择，而且无可推卸——连「不选择」也是一种选择。这份彻底的自由是重负，所以说人是「<b>被判处</b>自由的」。","<b>自欺（bad faith）</b>：为逃避这份自由的焦虑，人常常自欺——假装自己「别无选择」「角色使然」「身不由己」，把自己降格成一个被决定的物。"],"legacy":"他把存在主义带出学院，变成一整代人的生活姿态与文化运动（连同波伏娃、加缪）。「人是自己选择的总和」「他人即地狱」这些命题，让哲学重新与自由、责任、行动这些切身问题挂钩。","from":["heidegger","kierkegaard"],"to":[],"works":["存在与虚无","存在主义是一种人道主义"],"quote":"人，是被判处自由的。"},{"id":"freud","nm":"弗洛伊德","en":"Freud","b":"1856","d":"1939","s":"psy","sym":"🧊","ess":"我不是自己家里的主人——理性之下有潜意识在操纵。","ctx":"19世纪的人相信自己是理性的、自主的主体。弗洛伊德从临床出发（癔症、梦、口误），提出一个冒犯性的结论：你并不真正认识、也不真正主宰你自己。","ideas":["<b>潜意识</b>：意识只是心灵的冰山一角，水面之下是庞大的潜意识——被压抑的欲望、创伤、冲动，它们无声地操纵着我们的行为、情绪与选择。","<b>症状与出口</b>：被压抑的东西不会消失，而是变形着回来——梦、口误、玩笑、神经症状，都是潜意识加了密的表达。精神分析就是解读这套密码。","<b>人格三分</b>：本我（原始欲望）、超我（内化的道德禁令）、自我（在二者与现实之间艰难协调）。人时刻处在内部冲突之中。","<b>俄狄浦斯情结</b>：早年家庭关系中的欲望与禁忌，深刻塑造了人格结构。"],"legacy":"他本人算不算「哲学家」有争议（波普尔批评精神分析不可证伪、不是科学），但他与叔本华、尼采一道，完成了对「理性主体」的<b>去中心化</b>——理性不再是心灵的主人。这一冲击经由拉康进入哲学，成为后结构主义与整个文化理论的地基。","from":["schopenhauer"],"to":["lacan","jung"],"works":["梦的解析","精神分析引论","文明及其不满"],"quote":"自我，并不是自己家中的主人。"},{"id":"lacan","nm":"拉康","en":"Lacan","b":"1901","d":"1981","s":"psy","sym":"🪞","ess":"潜意识，像语言一样被结构。","ctx":"20世纪中期，弗洛伊德的学说日渐被通俗化、心理治疗化。拉康打出「回到弗洛伊德」的旗号，却用结构主义语言学与哲学，把它整个重写了一遍。","ideas":["<b>镜像阶段</b>：婴儿在镜中第一次看到自己「完整」的形象而欢欣认同——但那个形象是外在的、是个<b>误认</b>。自我从一开始就建立在一个异己的影像上，是虚构的、疏离的。「我」不是自明的起点，而是一个被建构、被误认的结果。","<b>潜意识像语言一样被结构</b>：他借索绪尔的语言学，主张潜意识不是一团模糊的本能，而是像语言那样，由能指的链条、替换与移置构成。欲望顺着能指无尽滑动，永远无法真正满足。","<b>想象界·象征界·实在界</b>：他用这三个层次重构人的精神世界——尤其「象征界」（语言与社会律法的秩序）如何在我们出生前，就等着规定我们。"],"legacy":"他把精神分析牢牢地哲学化，接通了黑格尔（主奴、欲望与承认）、海德格尔与语言学。他是后结构主义无法绕开的一环——也正是你论文里「投射」框架的直接理论土壤：主体如何在一个外在形象／他者上，认出并误认自己。","from":["freud","saussure"],"to":[],"works":["文集（Écrits）","研讨班"],"quote":"潜意识，像语言一样被结构。"},{"id":"foucault","nm":"福柯","en":"Foucault","b":"1926","d":"1984","s":"psy","sym":"🏛️","ess":"知识与权力，是同一件事的两面。","ctx":"结构主义之后，福柯不再问「什么是真理」「什么是人性」，而是问一个更冷峻的历史问题：这些被视为天经地义的「真理」和「正常」，是<b>怎样、被谁</b>制造出来的？","ideas":["<b>权力/知识</b>：权力不只是压制，更是<b>生产</b>——它生产知识、生产「真理」、生产我们认为正常的东西。知识与权力互相缠绕、无法分开：每一套知识都支撑着一套权力，反之亦然。","<b>规训与全景敞视</b>：现代权力不再靠公开处决的酷刑，而是靠学校、医院、监狱、工厂里细密的<b>规训</b>——通过时间表、考核、无处不在的注视（全景敞视监狱是其模型），把人塑造成自我监视、温顺高效的身体。","<b>话语与谱系学</b>：他考察「疯癫」「疾病」「性」这些概念的历史，揭示它们并非自然事实，而是特定时代的<b>话语</b>建构。所谓「人」，也不过是近代知识型的一个晚近发明，可能终将被抹去。"],"legacy":"他是当代人文社科影响最大的思想家之一。权力、话语、规训、身体这套词汇，重塑了历史学、社会学、性别研究与媒介文化研究——对你所在的传播与文化研究领域，尤其是绕不开的基石。","from":["nietzsche"],"to":[],"works":["规训与惩罚","疯癫与文明","性史"],"quote":"哪里有权力，哪里就有反抗。"},{"id":"derrida","nm":"德里达","en":"Derrida","b":"1930","d":"2004","s":"psy","sym":"✂️","ess":"文本之外别无他物——意义永远在延异中滑动。","ctx":"他从海德格尔「解构西方形而上学」的思路出发，把矛头对准整个西方思想赖以运转的方式：非此即彼的<b>二元对立</b>。","ideas":["<b>解构</b>：西方思想总用成对的对立来组织世界——言语／文字、在场／缺席、男／女、自然／文化——并且总把前一项奉为更本真、更高级。解构就是潜入文本内部，揭示这种等级其实站不住脚、甚至被文本自身悄悄颠覆。它不是「破坏」，而是显示意义如何自我拆解。","<b>延异（différance）</b>：意义从不当下自足。一个词的意义永远依赖它与别的词的<b>差异</b>，又永远被<b>推迟</b>到下一个词——意义在能指链上无尽滑动，永远不完全到场。他生造「différance」（差异＋延迟）来命名这一运动。","<b>文本之外无他物</b>：不存在一个可以一劳永逸锚定意义的、语言之外的「在场」。我们永远已经在文本、在解释、在语言之中。"],"legacy":"解构深刻影响了文学理论、法律、建筑、艺术与文化批评，是「后结构主义／后现代」最具标志性的方法。它教人对任何自称「自然」「本质」「中立」的东西保持警惕——去看它压抑了什么、颠倒了什么。","from":["heidegger","saussure"],"to":[],"works":["论文字学","书写与差异"],"quote":"文本之外，别无他物。"},{"id":"saussure","nm":"索绪尔","en":"Saussure","b":"1857","d":"1913","s":"structuralism","sym":"🔤","ess":"语言是一个纯粹由差异构成的符号系统。","ctx":"19世纪的语言学忙于追溯词的历史演变。索绪尔把目光转向语言「此刻」如何作为一个系统运作——为整个20世纪的「结构」思维奠基。","ideas":["<b>能指与所指</b>：一个语言符号由「能指」（音响形象，如「树」这串声音）与「所指」（概念，树的观念）两面构成。二者的结合是<b>任意的</b>——没有任何自然理由让「树」这串音对应树，全凭约定。","<b>意义源于差异</b>：一个词的意义不来自它指向的实物，而来自它与系统中其他词的<b>差异</b>（「猫」之所以是「猫」，因为它不是「狗」不是「帽」）。语言是一个「没有正项、只有差异」的系统。","<b>语言（langue）与言语（parole）</b>：他区分作为社会共享系统的「语言」与个人具体使用的「言语」，主张语言学应研究前者那套底层结构。","<b>共时优先于历时</b>：先研究系统在某一时刻的「共时」结构，而非其历史演变。"],"legacy":"他开创的结构主义语言学，成了20世纪人文社科的通用方法论——从列维-斯特劳斯的人类学、拉康的精神分析、巴特的符号学，到德里达的解构，无一不从他出发（再各自改写或颠覆他）。「意义是关系而非实体」这一洞见，是整个结构主义／后结构主义的地基，也是媒介与文化研究拆解符号的起点。","from":[],"to":["levistrauss","barthes","lacan","derrida"],"works":["普通语言学教程"],"quote":"在语言中，只有差异，没有正项。"},{"id":"levistrauss","nm":"列维-斯特劳斯","en":"Lévi-Strauss","b":"1908","d":"2009","s":"structuralism","sym":"🗿","ess":"神话千变万化，底下是同一套结构在运转。","ctx":"他把索绪尔的语言学模型搬进人类学——如果语言背后有普遍结构，那亲属制度、神话、图腾是否也如此？","ideas":["<b>结构人类学</b>：表面上各民族的习俗、神话千差万别，但底层都由一套普遍的、无意识的<b>二元对立</b>（自然／文化、生／熟、男／女）组织而成。人类心智共享同一套结构。","<b>神话的深层语法</b>：他像分析句子结构那样分析神话，寻找不同文化神话背后共同的组合规则。","<b>「野性的思维」</b>：所谓「原始」民族的思维并不低级，只是一种与现代科学不同、却同样严密的分类系统。"],"legacy":"他把「结构」确立为20世纪思想的核心范式，让结构主义从语言学扩张为一场席卷人类学、文学、哲学的运动。他也是「去中心化主体」的推手之一：不是人在使用结构，而是结构在通过人运作。","from":["saussure"],"to":[],"works":["野性的思维","神话学","忧郁的热带"],"quote":"不是人如何思考神话，而是神话如何在人身上自我思考。"},{"id":"barthes","nm":"罗兰·巴特","en":"Barthes","b":"1915","d":"1980","s":"structuralism","sym":"🏷️","ess":"日常的图像与商品，都在悄悄兜售一套「神话」。","ctx":"巴特把索绪尔的符号学从语言扩展到整个文化——广告、摔跤、牛排、时尚、照片，都是可解读的符号系统。这一步直接把结构主义带进了媒介与大众文化分析。","ideas":["<b>神话学</b>：他分析大众文化的日常符号（一则葡萄酒广告、一张杂志封面），揭示它们如何把特定的意识形态「自然化」，伪装成天经地义的常识。这是媒介批判的经典范式。","<b>符号的二级意指</b>：符号除了字面义（直接意指），还携带一层文化内涵（含蓄意指）——正是这层内涵在偷偷传递价值观。","<b>作者已死</b>：文本的意义不由作者的意图决定，而在读者的解读中生成。这一步把他从结构主义推向后结构主义，也解放了文本的多重读法。"],"legacy":"他是连接结构主义、符号学与媒介／文化研究的关键人物。「解读日常符号背后的意识形态」这一手法，是今天广告分析、视觉文化、媒介批评的直接源头——对你研究注意力与景观的框架尤其贴近。","from":["saussure"],"to":["baudrillard"],"works":["神话学","符号学原理","明室","恋人絮语"],"quote":"文本的诞生，须以作者之死为代价。"},{"id":"benjamin","nm":"本雅明","en":"Benjamin","b":"1892","d":"1940","s":"media","sym":"🎞️","ess":"机械复制，抽掉了艺术品身上那圈独一无二的「灵光」。","ctx":"摄影与电影兴起，艺术第一次可被无限复制。本雅明——游走于法兰克福学派边缘的马克思主义者——追问：这对艺术、对感知、对政治意味着什么？","ideas":["<b>灵光（aura）的消逝</b>：传统艺术品（一幅原作）有一种此时此地、独一无二的「灵光」。机械复制（照片、电影）把作品从其独特的时空中剥离，灵光随之消散。","<b>复制的解放性</b>：他不只是哀悼。复制让艺术走出神殿与贵族，走向大众，具有民主化、政治化的潜能——但也可能被法西斯用来把政治「审美化」。","<b>拱廊街与现代性</b>：他把19世纪巴黎的拱廊、商品、闲逛者当作解读现代性的碎片，开创了一种诗性的文化批评。"],"legacy":"他是媒介理论的先声——第一个严肃思考「复制技术如何改造感知与文化」的人。《机械复制时代的艺术作品》至今是媒介、电影与视觉文化研究的必读起点。","from":["marx"],"to":["adorno"],"works":["机械复制时代的艺术作品","拱廊街计划","历史哲学论纲"],"quote":"每一件文明的记录，同时也是一件野蛮的记录。"},{"id":"adorno","nm":"阿多诺","en":"Adorno","b":"1903","d":"1969","s":"media","sym":"🏭","ess":"大众文化不是人民的文化，而是流水线生产出来的「文化工业」。","ctx":"流亡美国的阿多诺，目睹好莱坞、流行乐、广播如何批量生产娱乐。他与霍克海默要诊断：启蒙许诺的自由，为何反而滑向了新的操控？","ideas":["<b>文化工业</b>：电影、流行音乐、广播被当作工业产品批量制造，看似丰富多样，实则高度标准化。它提供的不是解放，而是让人顺从现状的<b>廉价慰藉</b>。","<b>启蒙的辩证法</b>：本应破除神话、带来自由的理性，一旦沦为纯粹的工具（技术、计算、效率），反而制造出新的支配与野蛮。","<b>否定的辩证法</b>：他拒绝一切现成的和解与体系，坚持用批判去揭露「同一性」思维对个别事物的碾压。"],"legacy":"他是法兰克福学派与「批判理论」的核心。「文化工业」这一概念，是理解大众媒体、消费文化、娱乐产业如何塑造意识的经典武器——与你关注的注意力经济、景观直接同源。","from":["marx","benjamin"],"to":["habermas"],"works":["启蒙辩证法","否定的辩证法","文化工业"],"quote":"在错误的生活中，不存在正确的生活。"},{"id":"mcluhan","nm":"麦克卢汉","en":"McLuhan","b":"1911","d":"1980","s":"media","sym":"📺","ess":"真正改变我们的，不是媒介传递的内容，而是媒介本身。","ctx":"电视时代来临，众人只盯着节目内容的好坏。麦克卢汉把问题整个掉转：媒介的形式本身——而非它承载的信息——才在悄悄重塑我们的感知与社会。","ideas":["<b>媒介即讯息</b>：一种媒介带来的真正影响，是它改变了我们感知与思考的<b>尺度、节奏与模式</b>，而不在于它传递的具体内容。铁路的影响不在于运了什么货，而在于它创造了新的城市与节奏。","<b>媒介是人的延伸</b>：轮子延伸脚，书延伸眼，电子媒介延伸整个神经系统——每一次延伸都同时带来某种「截除」与麻木。","<b>地球村</b>：电子媒介让信息瞬间抵达全球，把世界重新压缩成一个部落式的「地球村」（他在互联网之前就预见了这一点）。","<b>冷媒介与热媒介</b>：他区分需要受众高度参与去补全的「冷媒介」，与信息饱满、参与度低的「热媒介」。"],"legacy":"他是「媒介理论」的奠基人，把媒介从透明的传输管道，变成需要被独立分析的对象。「媒介即讯息」「地球村」这些说法，塑造了此后所有关于技术如何改造社会的讨论——是你这个专业的开山坐标之一。","from":[],"to":["baudrillard"],"works":["理解媒介","谷登堡星系","媒介即讯息"],"quote":"媒介，即讯息。"},{"id":"debord","nm":"德波","en":"Debord","b":"1931","d":"1994","s":"media","sym":"🎪","ess":"在发达资本主义里，一切曾被直接经历的，都退化成了景观。","ctx":"战后消费社会与大众传媒全面铺开。德波（情境主义国际的核心）把马克思的商品分析推进一步：当生活被影像全面中介，会发生什么？","ideas":["<b>景观社会</b>：现代社会中，真实的生活被海量<b>影像</b>取代与中介。「景观」不是一堆图像，而是「以图像为中介的人与人之间的社会关系」。人们从「存在」退到「占有」，再退到仅仅「显现」。","<b>景观即意识形态的完成</b>：景观让人被动观看、彼此隔离，用消费与奇观填满生活，从而维系现状、消解反抗。","<b>异轨与漂移</b>：反抗之道是「异轨」（挪用既有影像使其反转）与在城市中无目的地「漂移」，重新夺回被景观没收的真实体验。"],"legacy":"《景观社会》是理解<b>注意力经济、社交媒体、消费奇观</b>的关键文本——它几乎预言了一个被屏幕影像全面中介的世界。对你研究「注意力如何被景观捕获」，这是最直接的理论祖源之一。","from":["marx"],"to":["baudrillard"],"works":["景观社会"],"quote":"一切曾被直接经历的，都已远遁为一个表象。"},{"id":"baudrillard","nm":"鲍德里亚","en":"Baudrillard","b":"1929","d":"2007","s":"media","sym":"🪆","ess":"影像不再复制现实——它取代了现实，成了没有原本的「超真实」。","ctx":"鲍德里亚从符号学（巴特）与景观（德波）出发，走得更远：在媒体与消费的饱和里，「真实」本身是否还存在？","ideas":["<b>拟像与仿真</b>：符号经历四个阶段——从反映现实，到掩盖现实，到掩盖「现实已不存在」，最后与现实<b>再无关系</b>，成为纯粹的自我指涉。到这一步，影像不再是现实的摹本，而是「<b>拟像</b>」。","<b>超真实（hyperreality）</b>：当模型、地图、影像比现实更真、甚至先于现实存在（迪士尼、主题公园、媒体事件），我们就活在了「超真实」里——真与假的区分失效了。","<b>消费的符号逻辑</b>：我们消费的不是物的使用价值，而是它所承载的<b>符号与差异</b>（品牌、身份、地位）。"],"legacy":"他是理解<b>数字时代、媒体奇观、虚拟与真实交融</b>最被引用的理论家之一（《黑客帝国》即受其启发）。对你关于影像、投射与注意力的研究，他提供了最锋利也最极端的一端。","from":["barthes","debord","mcluhan"],"to":[],"works":["拟像与仿真","消费社会","象征交换与死亡"],"quote":"拟像从不掩盖真相——是真相掩盖了「从来没有真相」。"},{"id":"habermas","nm":"哈贝马斯","en":"Habermas","b":"1929","d":"至今","s":"media","sym":"🗣️","ess":"民主的根基，是人们能在一个公共空间里自由而理性地对话。","ctx":"法兰克福学派第二代。他不满前辈（阿多诺）对理性的彻底悲观，试图为理性、为民主重新找回规范性的根基。","ideas":["<b>公共领域</b>：他考察18世纪的咖啡馆、沙龙、报刊如何催生一个介于国家与私人之间的「公共领域」——公民在此就公共事务展开理性辩论，形成公共舆论。这是民主的关键基础设施，却在商业化的大众传媒下不断被侵蚀（「再封建化」）。","<b>交往理性</b>：理性不只是工具性的计算（阿多诺所批判的那种），还有一种「交往理性」——在无强制的对话中，凭更好的论据达成理解与共识。","<b>理想的言谈情境</b>：真正的共识，须在人人平等、不受权力与欺骗扭曲的交流条件下达成。"],"legacy":"「公共领域」是传播学、媒介与民主研究最核心的概念之一——今天关于社交媒体究竟在扩大还是瓦解公共讨论的争论，仍以他为起点。他是当代最重要的在世哲学家之一。","from":["adorno"],"to":[],"works":["公共领域的结构转型","交往行为理论"],"quote":"唯有更好的论据，才应具有强制力。"},{"id":"williams","nm":"雷蒙·威廉斯","en":"R. Williams","b":"1921","d":"1988","s":"media","sym":"📻","ess":"文化不是少数人的高雅趣味，而是「一整套生活方式」。","ctx":"出身威尔士工人家庭的威廉斯，反对把「文化」等同于精英艺术。他要从普通人的日常生活里重新定义文化，并奠定一门新学科：文化研究。","ideas":["<b>文化是一整套生活方式</b>：文化不只是文学与艺术的杰作，而是一个社会共享的意义、价值与日常实践的总和。「文化是平常的」。","<b>文化唯物主义</b>：他把马克思的分析用于文化，却拒绝「经济决定一切」的机械论——文化实践本身也是物质性的、能动的社会力量。","<b>反技术决定论</b>：在《电视》中他反驳麦克卢汉，主张一种媒介的形式与效果是社会选择与塑造的结果，而非技术本身注定。"],"legacy":"他与霍尔共同创立了<b>英国文化研究</b>（伯明翰学派），把大众文化、电视、日常生活确立为严肃的研究对象。这门学科，正是你所在专业的直接源头之一。","from":["marx"],"to":["hall"],"works":["文化与社会","漫长的革命","电视：技术与文化形式","关键词"],"quote":"文化，是平常的。"},{"id":"hall","nm":"斯图亚特·霍尔","en":"Stuart Hall","b":"1932","d":"2014","s":"media","sym":"🔀","ess":"同一则讯息，观众未必照制作者的意图去解读。","ctx":"出身牙买加、任教伯明翰的霍尔，是文化研究的关键塑造者。他要打破「媒介传播＝讯息被动地灌进受众脑中」这一简单模型。","ideas":["<b>编码/解码</b>：媒介讯息在制作端被「编码」进特定意义，受众在接收端则主动「解码」。解读有三种立场：完全接受（主导式）、部分认同（协商式）、乃至反着读（对抗式）。意义不在讯息里，而在编码与解码的接合处生成。","<b>接合与意识形态</b>：意义与身份不是固定的，而是在特定条件下被「接合」起来的，可被拆解、被重新连接。媒介是意识形态斗争的场域。","<b>表征（representation）</b>：媒介不是反映现实，而是<b>建构</b>现实——尤其在种族与族群的再现上，它生产并流通着关于「他者」的意义。"],"legacy":"「编码/解码」是媒介与传播研究被引用最多的模型之一，它把受众从被动的靶子，改写成能动的意义生产者。霍尔是<b>文化研究</b>最具影响力的奠基者，对种族、身份与媒介再现的研究影响至今。","from":["williams"],"to":[],"works":["编码/解码","表征","文化身份与离散"],"quote":"意义不是被发现的，而是被生产的。"},{"id":"jung","nm":"荣格","en":"Jung","b":"1875","d":"1961","s":"psy","sym":"☯️","ess":"意识之下不只有个人的压抑，还有全人类共享的原始意象。","ctx":"荣格曾是弗洛伊德最看重的接班人，却因无法接受「一切都归于性欲」而与之决裂。他要为潜意识开辟一个更广阔、更具精神性的维度。","ideas":["<b>集体无意识</b>：在弗洛伊德的「个人潜意识」（个人被压抑的经历）之下，荣格提出一层更深的<b>集体无意识</b>——全人类共同继承的、跨越文化的心理底层。","<b>原型（archetype）</b>：集体无意识由一批普遍的「原型」构成——英雄、母亲、智慧老人、阴影、阿尼玛／阿尼姆斯。它们反复出现在世界各地的神话、宗教、梦与故事里（这也是后来「英雄之旅」叙事理论的源头）。","<b>阴影与个体化</b>：<b>阴影</b>是我们不愿承认、于是投射到他人身上的那部分自我。心理成长的目标是<b>个体化</b>——把意识与潜意识、把阴影与光明整合为一个完整的自我。","<b>心理类型与共时性</b>：他提出内倾／外倾等心理类型（后来MBTI的雏形），并以「共时性」描述有意义的巧合。"],"legacy":"他与弗洛伊德分道扬镳，独立开创了<b>分析心理学</b>。他的原型与集体无意识理论，深刻影响了神话学（坎贝尔的「英雄之旅」）、文学与电影叙事、乃至品牌与流行文化分析——对研究媒介中的原型形象与象征尤其好用。","from":["freud"],"to":[],"works":["原型与集体无意识","心理类型","红书","寻找灵魂的现代人"],"quote":"向外张望的人在做梦，向内审视的人才觉醒。"}];

  let h=`<button class="chip all" data-s="" aria-pressed="${allOn}" style="${allOn?'background:var(--band);border-color:var(--ink3);':''}"><span class="dot"></span>纵览全部</button>`;
  COLS.forEach(id=>{const s=SCHOOLS[id];const on=state.school===id;
    h+=`<button class="chip" data-s="${id}" aria-pressed="${on}" style="${on?`background:${s.hex}22;border-color:${s.hex};`:``}"><span class="dot" style="background:${s.hex}"></span>${s.name}</button>`;});
  legendEl.innerHTML=h;
  legendEl.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{state.school=c.dataset.s||null;render();});
}
function buildNote(){
  const n=document.getElementById("schoolnote");
  if(!state.school){n.innerHTML="";return;}
  const s=SCHOOLS[state.school];
  n.innerHTML=`<div class="card" style="border-left-color:${s.hex}"><b style="color:${s.hex}">${s.name}</b> · ${s.blurb}</div>`;
}
const NS="http://www.w3.org/2000/svg";
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}
function nh(id){return byId[id].turn?TNH:NH;}
function edgePath(src,tgt){
  const s=pos[src],t=pos[tgt];
  if(s.col===t.col){const x=s.x,y1=s.y+nh(src)/2,y2=t.y+nh(tgt)/2,bx=x-28;return `M${x},${y1} C ${bx},${y1} ${bx},${y2} ${x},${y2}`;}
  const sx=s.x+NW,sy=s.y+nh(src)/2,tx=t.x,ty=t.y+nh(tgt)/2,dx=Math.max((tx-sx)/2,30);
  return `M${sx},${sy} C ${sx+dx},${sy} ${tx-dx},${ty} ${tx},${ty}`;
}
function buildMap(){
  const wrap=document.getElementById("mapwrap");wrap.innerHTML="";
  const svg=el("svg",{class:"tree",width:TW,height:TH,viewBox:`0 0 ${TW} ${TH}`,role:"group","aria-label":"哲学分支树"});
  const dimS=state.school;
  const defs=el("defs");
  COLS.forEach(id=>{
    const m=el("marker",{id:"ar-"+id,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto-start-reverse"});
    m.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:SCHOOLS[id].hex}));
    defs.appendChild(m);
  });
  const om=el('marker',{id:'ar-opp',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});
  om.appendChild(el('path',{d:'M0,0 L10,5 L0,10 z',fill:'#9e2b2b'}));
  defs.appendChild(om);
  svg.appendChild(defs);
  const axisY=20;
  svg.appendChild(el("line",{class:"axis",x1:PADX,y1:axisY,x2:TW-PADX,y2:axisY,"marker-end":"url(#ar-greek)"}));
  svg.appendChild(el("text",{class:"axislab",x:PADX,y:axisY-8},"古"));
  svg.appendChild(el("text",{class:"axislab","text-anchor":"end",x:TW-PADX,y:axisY-8},"今 →"));
  LAYOUT.forEach((ids,ci)=>{
    const bx=PADX+ci*COLW-14, bw=NW+28;
    if(ci%2===0)svg.appendChild(el("rect",{x:bx,y:34,width:bw,height:TH-42,rx:10,fill:"rgba(120,100,60,0.05)"}));
    const px=PADX+ci*COLW+NW/2;
    const label=COLHEAD[ci];
    const pw=Math.max(label.length*10.5+16,66);
    svg.appendChild(el("rect",{class:"colhead-pill",x:px-pw/2,y:38,width:pw,height:20,rx:10}));
    svg.appendChild(el("text",{class:"colhead","text-anchor":"middle",x:px,y:52},label));
  });
  P.forEach(p=>p.from.forEach(fid=>{
    const cross=byId[fid].s!==p.s;
    const path=el("path",{class:"edge",d:edgePath(fid,p.id),stroke:SCHOOLS[p.s].hex,
      "stroke-width":cross?3.4:2.2,"stroke-linecap":"round",
      opacity:cross?0.95:0.8,"marker-end":"url(#ar-"+p.s+")"});
    if(dimS&&dimS!==p.s&&dimS!==byId[fid].s)path.classList.add("dim");
    svg.appendChild(path);
  }));
  P.forEach(p=>{
    const s=SCHOOLS[p.s],pp=pos[p.id],H=nh(p.id);
    const g=el("g",{class:"node",tabindex:0,role:"button","aria-label":`${p.nm}，${s.name}${p.turn?"，转折点："+p.turn:""}`});
    if(p.turn)g.appendChild(el("rect",{class:"glow",x:pp.x-3.5,y:pp.y-3.5,width:NW+7,height:H+7,rx:13}));
    g.appendChild(el("rect",{class:"box",x:pp.x,y:pp.y,width:NW,height:H,rx:11,stroke:s.hex}));
    g.appendChild(el("text",{class:"emo",x:pp.x+20,y:pp.y+24},p.sym));
    g.appendChild(el("text",{class:"nm",x:pp.x+37,y:pp.y+17},p.nm));
    g.appendChild(el("text",{class:"dt",x:pp.x+37,y:pp.y+32},`${p.b}–${p.d}`));
    if(p.turn)g.appendChild(el("text",{class:"turncap",x:pp.x+14,y:pp.y+50},`✦ ${p.turn}`));
    if(dimS&&dimS!==p.s)g.classList.add("dim");
    const go=()=>openSheet(p.id);
    g.addEventListener("click",go);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
    svg.appendChild(g);
  });
  if(state.opp){
    OPPOSITIONS.filter(o=>o.map).forEach(o=>{
      const A=pos[o.anchor[0]],B=pos[o.anchor[1]];
      const x1=A.x+NW/2,y1=A.y+nh(o.anchor[0])/2,x2=B.x+NW/2,y2=B.y+nh(o.anchor[1])/2;
      svg.appendChild(el('line',{class:'opp-line',x1,y1,x2,y2,'marker-start':'url(#ar-opp)','marker-end':'url(#ar-opp)'}));
      const mx=(x1+x2)/2,my=(y1+y2)/2,w=o.short.length*11+16;
      svg.appendChild(el('rect',{class:'opp-pill',x:mx-w/2,y:my-11,width:w,height:22,rx:11}));
      svg.appendChild(el('text',{class:'opp-lab','text-anchor':'middle',x:mx,y:my},o.short));
    });
  }
  wrap.appendChild(svg);
}
const backdrop=document.getElementById("backdrop"),sheet=document.getElementById("sheet");
let lastFocus=null;
function relChips(ids){
  if(!ids.length)return `<span class="none">—</span>`;
  return `<div class="relchips">`+ids.map(id=>{const q=byId[id];
    return `<button class="relchip" data-go="${id}">${q.sym} ${q.nm} <span style="color:${SCHOOLS[q.s].hex};font-size:12px">●</span></button>`;}).join("")+`</div>`;
}
function openSheet(id){
  const p=byId[id],s=SCHOOLS[p.s];
  if(!backdrop.classList.contains("on"))lastFocus=document.activeElement;
  sheet.innerHTML=`
    <div class="top" style="border-top-color:${s.hex}">
      <button class="close" aria-label="关闭">✕</button>
      <div class="sym">${p.sym}</div>
      <div class="who"><div><h2 id="sheetName">${p.nm}</h2><div class="en">${p.en}</div></div></div>
      <div class="badges"><span class="schbadge" style="background:${s.hex}1e;color:${s.hex};border:1.5px solid ${s.hex}">${s.name}</span><span class="dates">${p.b} – ${p.d}</span>${p.turn?`<span class="dates" style="color:var(--gold)">✦ ${p.turn}</span>`:``}</div>
    </div>
    <div class="body">
      <p class="essence">${p.ess}</p>
      <div class="seclabel">背景 · 他面对的问题</div>
      <p class="ctx">${p.ctx}</p>
      <div class="seclabel">核心理论</div>
      <ul class="ideas">${p.ideas.map(x=>`<li>${x}</li>`).join("")}</ul>
      <div class="seclabel">转折与贡献</div>
      ${p.turn?`<div class="turnbanner">✦ ${p.turn}</div>`:``}
      <p class="legacy">${p.legacy}</p>
      <div class="seclabel">师承脉络</div>
      <div class="lineage">
        <div class="lin-row"><span class="k">师承自</span>${relChips(p.from)}</div>
        <div class="lin-row"><span class="k">影响了</span>${relChips(p.to)}</div>
      </div>
      <div class="seclabel">代表著作</div>
      <div class="works">${p.works.map(w=>`<span class="work${p.worksPlain?' plain':''}">${p.worksPlain?w:'《'+w+'》'}</span>`).join("")}</div>
      <div class="quote">${p.quote}</div>
    </div>`;
  sheet.querySelector(".close").onclick=closeSheet;
  sheet.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>openSheet(b.dataset.go));
  backdrop.classList.add("on");sheet.scrollTop=0;sheet.querySelector(".close").focus();
}
function closeSheet(){backdrop.classList.remove("on");if(lastFocus&&lastFocus.focus)lastFocus.focus();}
backdrop.addEventListener("click",e=>{if(e.target===backdrop)closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&backdrop.classList.contains("on"))closeSheet();});
function buildOpps(){
  const c=document.getElementById('opps');
  const chip=id=>{const q=byId[id];return '<button class=\'relchip\' data-go=\''+id+'\'>'+q.sym+' '+q.nm+'</button>';};
  c.innerHTML='<div class=\'oppsHead\'>主要对立轴 · 理论之间的分歧（点名字看详解）</div>'+OPPOSITIONS.map(o=>
    '<div class=\'oppcard\'><div class=\'opphead\'>'+o.t.replace('↔','<span class=\'vs\'>↔</span>')+'</div>'+
    '<div class=\'oppq\'>'+o.q+'</div>'+
    '<div class=\'opprow\'><span class=\'pole\'>'+o.aL+'</span><div class=\'pchips\'>'+o.a.map(chip).join('')+'</div></div>'+
    '<div class=\'opprow\'><span class=\'pole\'>'+o.bL+'</span><div class=\'pchips\'>'+o.b.map(chip).join('')+'</div></div></div>'
  ).join('');
  c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openSheet(b.dataset.go));
}
const oppBtn=document.getElementById('oppToggle');
oppBtn.onclick=()=>{state.opp=!state.opp;oppBtn.setAttribute('aria-pressed',state.opp);oppBtn.textContent=state.opp?'－ 隐藏图上对立轴':'＋ 在图上叠加对立轴';buildMap();};
function render(){buildLegend();buildNote();buildMap();buildOpps();}
render();

</script>
